function unduhBase64(b64,nama){
  var bin=atob(b64), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  var url=URL.createObjectURL(new Blob([arr],{type:'application/pdf'}));
  var a=document.createElement('a'); a.href=url; a.download=nama; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},60000);
}


/* ---------- Penyusun laporan formal (dipakai Rekap Ruangan, Laporan Bulanan, Laporan HH/APD) ---------- */
var F_HIJAU='#E2EFDA';
function fJudul(huruf,teks,pb){var o={text:(huruf?huruf+'. ':'')+teks,bold:true,fontSize:10.5,margin:[0,10,0,5],headlineLevel:1};if(pb){o.pageBreak='before';o.pageOrientation=pb;}return o;}
function fPar(teks){return {text:String(teks||'-').trim()||'-',fontSize:9.5,alignment:'justify',lineHeight:1.3,margin:[0,0,0,6]};}
function fCatatan(teks){return {text:teks,fontSize:8,italics:true,color:'#444',margin:[0,0,0,6]};}
function fGaris(){return {hLineWidth:function(){return .5;},vLineWidth:function(){return .5;},paddingLeft:function(){return 4;},paddingRight:function(){return 4;},paddingTop:function(){return 2.5;},paddingBottom:function(){return 2.5;}};}
/* head: array judul kolom (atau array baris untuk header bertingkat — objek pdfmake boleh). rows: array baris.
   o: {kiri:[idx kolom rata kiri], widths, tebal:fn(row)->bool, kosong:'teks'} */
function fTabel(head,rows,o){
  o=o||{};
  var hRows=Array.isArray(head[0])?head:[head], n=hRows[0].reduce(function(a,c){return a+((c&&c.colSpan)||1);},0);
  var body=hRows.map(function(hr){return hr.map(function(h){
    if(h&&typeof h==='object')return 'text' in h?Object.assign({bold:true,fillColor:F_HIJAU,alignment:'center'},h):{};
    return {text:String(h),bold:true,fillColor:F_HIJAU,alignment:'center'};});});
  if(!rows.length)body.push([{text:o.kosong||'Tidak ada data.',colSpan:n,alignment:'center',italics:true}].concat(Array(n-1).fill({})));
  rows.forEach(function(r){
    var tb=o.tebal&&o.tebal(r);
    body.push(r.map(function(v,i){
      if(v&&typeof v==='object')return v;
      return {text:v==null?'':String(v),alignment:(o.kiri||[]).indexOf(i)>=0?'left':'center',bold:!!tb,fillColor:tb?'#F2F2F2':undefined};}));
  });
  return {table:{headerRows:hRows.length,dontBreakRows:true,widths:o.widths||Array(n).fill('*'),body:body},layout:fGaris(),
    fontSize:o.font||(n>14?6.5:n>10?7.5:8.5),margin:[0,0,0,8]};
}
var _noGbr=0;
function fGambar(idCanvas,keterangan,lebar,tinggi){
  var cv=document.getElementById(idCanvas); if(!cv)return [];
  try{_noGbr++;return [{unbreakable:true,stack:[
    {table:{widths:['*'],body:[[{image:cv.toDataURL('image/png'),fit:[lebar-12,tinggi||190],alignment:'center',margin:[0,4,0,4]}]]},layout:fGaris()},
    {text:'Gambar '+_noGbr+'. '+keterangan,fontSize:8.5,italics:true,alignment:'center',margin:[0,3,0,8]}]}];}catch(e){return [];}
}
function teksNarasi(id){var e=document.getElementById(id);return e?(e.innerText||e.textContent||'').trim():'';}
function capaianTeks(x){var u=String(x.satuan||'').trim();return x.nilai+(u?' '+u:'');}

/* ===== Rekap Ruangan ===== */
function kontenRekapRuangan(r,lebar){
  _noGbr=0; var k=[], h=0, H='ABCDEFGH';
  if(r.rate.length){
    k.push(fJudul(H[h++],'Ringkasan Capaian Indikator'));
    k.push(fTabel(['No','Indikator','Kejadian','Pembagi (Tindakan)','Rumus','Capaian','Keterangan'],
      r.rate.map(function(x,i){return [i+1,x.label+(x.pasangan?'\n'+'Pembagi: '+x.pasangan:''),x.numerator,x.pasangan_field_id?x.denominator:'-',
        x.pasangan_field_id?(x.numerator+' / '+x.denominator+' × '+x.pengali):'Jumlah kasus',capaianTeks(x),x.numerator>0?'Perlu perhatian':'Baik'];}),
      {kiri:[1],widths:[22,'*',50,70,95,70,75]}));
    k.push(fJudul(H[h++],'Grafik Jumlah Kejadian per Indikator'));
    k=k.concat(fGambar('rcLaporanBulanan','Jumlah kejadian tiap indikator, '+bulanPanjangID(r.periode)+' — '+r.ruangan.nama,lebar,170));
  }
  if(r.kepatuhan&&r.kepatuhan.length){
    k.push(fJudul(H[h++],'Kepatuhan'));
    k.push(fTabel(['No','Item','Patuh','Total','Kepatuhan'],r.kepatuhan.map(function(x,i){return [i+1,x.label,x.ya,x.total,x.persen+'%'];}),{kiri:[1],widths:[22,'*',60,60,70]}));
  }
  k.push(fJudul(H[h++],'Rekapitulasi Data Harian'));
  var head=['Tanggal'].concat(r.kolom.map(function(c){return labelSingkat(c.label);}));
  var rows=r.baris.map(function(b){return [fmtID(b.tanggal)+(b.flag_koreksi==='YA'?' *':'')].concat(r.kolom.map(function(c){return b.sel[c.field_id]||0;}));});
  if(r.baris.length)rows.push(['JUMLAH'].concat(r.kolom.map(function(c){return r.total[c.field_id]||0;})));
  k.push(fTabel(head,rows,{tebal:function(x){return x[0]==='JUMLAH';},widths:[62].concat(Array(r.kolom.length).fill('*')),kosong:'Belum ada pengisian bulan ini.'}));
  var kor=r.baris.filter(function(b){return b.flag_koreksi==='YA'&&b.catatan_koreksi;});
  if(kor.length)k.push(fCatatan('* Catatan koreksi Komite PPI: '+kor.map(function(b){return fmtID(b.tanggal)+' — '+b.catatan_koreksi;}).join('; ')));
  k.push(fJudul(H[h++],'Daftar Pasien Kejadian'));
  k.push(fTabel(['No','Tgl Lapor','Jenis Kejadian','Nama Pasien','Tgl Tindakan','Tgl Kejadian','Penyebab Kejadian'],
    (r.pasien||[]).map(function(p,i){return [i+1,fmtID(p.tanggal),labelSingkat(p.jenis_kejadian),p.nama_pasien,fmtID(p.tanggal_tindakan),fmtID(p.tanggal_kejadian),p.penyebab_kejadian||'-'];}),
    {kiri:[2,3,6],widths:[22,62,90,'*',62,62,'*'],kosong:'Tidak ada pasien kejadian bulan ini.'}));
  if(r.antibiotik&&r.antibiotik.length){
    k.push(fJudul(H[h++],'Rekap Pemakaian Antibiotik'));
    k.push(fTabel(['No','Nama Antibiotik','Jumlah'],r.antibiotik.map(function(o,i){return [i+1,o.nama,o.jumlah];}),{kiri:[1],widths:[22,'*',80]}));
  }
  if(r.rate.length){
    var ada=r.rate.filter(function(x){return x.numerator>0;});
    k.push(fJudul(H[h++],'Analisis'));
    k.push(fPar(ada.length
      ?'Pada bulan '+bulanPanjangID(r.periode)+', ruangan '+r.ruangan.nama+' mencatat kejadian pada indikator: '+ada.map(function(x){return x.label+' ('+capaianTeks(x)+')';}).join(', ')+'. Indikator lainnya menunjukkan capaian baik (tidak ada kejadian).'
      :'Pada bulan '+bulanPanjangID(r.periode)+', seluruh indikator kejadian di ruangan '+r.ruangan.nama+' menunjukkan capaian baik; tidak ada kejadian infeksi yang tercatat.'));
  }
  return k;
}

/* ===== Laporan Bulanan HAIs (halaman 1 & 4 tegak, tabel mendatar) ===== */
function kontenLaporanBulanan(r){
  _noGbr=0; var k=[], tegak=595-72, datar=842-72;
  k.push(fJudul('A','Grafik Total Tindakan dan Kejadian Seluruh Ruangan'));
  k=k.concat(fGambar('lpChart1','Total tindakan dan kejadian per indikator, '+bulanPanjangID(r.periode),tegak,230));
  k.push(fJudul('B','Nilai Capaian Indikator Tingkat Rumah Sakit'));
  k.push(fTabel(['No','Indikator','Tindakan','Kejadian','Capaian','Status'],
    r.capaian.map(function(x,i){return [i+1,x.label,/kasus/i.test(x.satuan||'')?'-':x.denominator,x.numerator,capaianTeks(x),x.status==='BAIK'?'Baik':'Perlu perhatian'];}),
    {kiri:[1],widths:[22,'*',50,50,60,70]}));
  k.push(fCatatan('Ruangan aktif: '+r.jumlahRuangan+' · Entri terisi bulan ini: '+r.jumlahTerisi));
  // C. tabel per ruangan (mendatar)
  k.push(fJudul('C','Total Tindakan dan Kejadian per Ruangan','landscape'));
  var h1=[{text:'Ruangan',rowSpan:2}], h2=[{}];
  r.indikator.forEach(function(ind){h1.push({text:labelSingkat(ind.label),colSpan:2},{});h2.push('Tindakan','Kejadian');});
  var rows=r.ruangan.map(function(row){return [row.nama].concat([].concat.apply([],r.indikator.map(function(ind){var m=row.mentah[ind.field_id]||{tindakan:0,kejadian:0};return [m.tindakan,m.kejadian];})));});
  rows.push(['JUMLAH RSUD'].concat([].concat.apply([],r.indikator.map(function(ind){var c=r.capaian.filter(function(x){return x.field_id===ind.field_id;})[0]||{numerator:0,denominator:0};return [c.denominator,c.numerator];}))));
  k.push(fTabel([h1,h2],rows,{kiri:[0],tebal:function(x){return x[0]==='JUMLAH RSUD';},widths:[90].concat(Array(r.indikator.length*2).fill('*')),font:7.5}));
  k.push(fJudul('D','Daftar Kejadian Pasien'));
  k.push(fTabel(['No','Tgl Lapor','Nama Pasien','Jenis Kejadian','Ruangan','Tgl Tindakan','Tgl Infeksi','Penyebab Kejadian'],
    r.daftarKejadian.map(function(p,i){return [i+1,fmtID(p.tanggal_lapor),p.nama_pasien,labelSingkat(p.jenis_kejadian),p.ruangan,fmtID(p.tanggal_tindakan),fmtID(p.tanggal_infeksi),p.penyebab_kejadian||'-'];}),
    {kiri:[2,3,4,7],widths:[22,62,'*',90,75,62,62,'*'],kosong:'Tidak ada kejadian tercatat bulan ini.'}));
  k.push(fJudul('E','Analisis Kejadian'));
  k.push(fPar(teksNarasi('lpNarasi3')));
  k.push(fJudul('F','Analisis Rekap Bulanan','portrait'));
  k.push(fPar(teksNarasi('lpNarasi4')));
  k.push(fJudul('G','Catatan Tambahan Komite PPI'));
  k.push(fPar(teksNarasi('lpCatatan')||'Tidak ada catatan tambahan.'));
  return k;
}

/* ===== Laporan Observasi HH / APD ===== */
function kontenLaporanObservasi(r,kode){
  _noGbr=0; var k=[], lebar=595-72, satuan=kode==='HH'?'Momen':'Item';
  k.push(fJudul('A','Grafik Kepatuhan per '+satuan));
  k=k.concat(fGambar('lpChartObs','Persentase kepatuhan per '+satuan.toLowerCase()+', '+r.namaBulan+' '+r.tahun,lebar,210));
  k.push(fJudul('B','Rincian Kepatuhan per '+satuan));
  k.push(fTabel(['No',satuan,'Patuh','Diamati','Kepatuhan'],r.itemChart.map(function(x,i){return [i+1,x.label,x.patuh,x.total,x.persen===null?'N/A':x.persen+'%'];}),{kiri:[1],widths:[22,'*',50,50,60]}));
  k.push(fJudul('C','Form A — Sensus Harian Indikator Mutu'));
  var rows=r.formA.map(function(x,i){return [i+1,x.ruang,x.total,x.peluang,x.capaian===null?'N/A':x.capaian+'%'];});
  rows.push(['','JUMLAH',r.formATotal.total,r.formATotal.peluang,r.formATotal.capaian===null?'N/A':r.formATotal.capaian+'%']);
  k.push(fTabel(['No','Ruang','Total','Peluang','Hasil Capaian'],rows,{kiri:[1],tebal:function(x){return x[1]==='JUMLAH';},widths:[22,'*',60,60,70]}));
  k.push(fJudul('D','Form B — Laporan Indikator Mutu (Komite PMKP)'));
  var b=r.formB, v=function(id,def){var e=document.getElementById(id);return (e&&e.value.trim())||def||'-';};
  var isi=[['Judul Indikator',b.judul_indikator],['Area Monitoring',b.area_monitoring],['Numerator',b.numerator],['Denominator',b.denominator],
    ['Formula',b.formula],['Target',b.target],['Hasil Capaian',b.hasil_capaian],['Kesimpulan',b.kesimpulan],
    ['Analisa Hasil Capaian',v('fbAnalisa',b.analisa)],['Rekomendasi Tindak Lanjut',v('fbRekomendasi',b.rekomendasi)]];
  k.push({unbreakable:true,table:{widths:[130,'*'],dontBreakRows:true,body:isi.map(function(x){return [{text:x[0],bold:true,fillColor:F_HIJAU},{text:String(x[1]||'-'),alignment:'justify'}];})},
    layout:fGaris(),fontSize:9,margin:[0,0,0,8]});
  return k;
}


/* ================= CEK SISTEM: pemeriksaan otomatis menyeluruh (Komite/Admin) ================= */
var CEK={};
function viewCekSistem(c){
  c.innerHTML='<div class="card card-pad mb"><h3>Cek Sistem</h3>'+
    '<div class="desc mb">Memeriksa SIPPI secara otomatis di perangkat, jaringan, dan server Anda: kecepatan koneksi, lama tiap halaman dimuat, '+
    'ukuran data di spreadsheet, kerja cache, folder foto, serta kecocokan versi dan alamat. Pemeriksaan tidak mengubah data apa pun dan '+
    'butuh sekitar 1 menit.</div>'+
    '<button class="btn teal" id="cekMulai">Jalankan pemeriksaan</button></div>'+
    '<div id="cekProses"></div><div id="cekHasil"></div>';
  $('#cekMulai').onclick=jalankanCekSistem;
}
function _infoPerangkat(){
  var ua=navigator.userAgent||'', os=/iPhone|iPad/.test(ua)?'iPhone/iPad':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':/Mac/.test(ua)?'Mac':'Lainnya';
  var br=/CriOS|Chrome\//.test(ua)&&!/Edg/.test(ua)?'Chrome':/Edg/.test(ua)?'Edge':/Firefox|FxiOS/.test(ua)?'Firefox':/SamsungBrowser/.test(ua)?'Samsung Internet':/Safari/.test(ua)?'Safari':'Lainnya';
  var cn=navigator.connection||{};
  return {os:os,browser:br,hp:/iPhone|iPad|Android/.test(ua),mode:MODE_APPS_SCRIPT?'Alamat Apps Script (…/exec)':'Alamat sendiri (GitHub)',
    alamat:MODE_APPS_SCRIPT?'(di dalam Apps Script)':location.origin+location.pathname,
    koneksi:cn.effectiveType?String(cn.effectiveType).toUpperCase()+(cn.downlink?' ±'+cn.downlink+' Mbps':''):'tidak diketahui'};
}
function _ukurPanggil(label,fn,args){
  var t=performance.now(); window.__tServer=null;
  return call.apply(null,[fn].concat(args)).then(function(r){
    return {label:label,fn:fn,ms:Math.round(performance.now()-t),server:window.__tServer,ok:!(r&&r.ok===false),info:(r&&r.ok===false)?(r.pesan||''):'',hasil:r};
  },function(e){return {label:label,fn:fn,ms:Math.round(performance.now()-t),server:window.__tServer,ok:false,info:(e&&e.message)||String(e)};});
}
function jalankanCekSistem(){
  var btn=$('#cekMulai'); btn.disabled=true; btn.textContent='Memeriksa…';
  $('#cekHasil').innerHTML='';
  var komite=S.user.role!=='PERAWAT';
  var langkah=[
    ['Uji jaringan #1','getInfoApp',['']],['Uji jaringan #2','getInfoApp',['']],['Uji jaringan #3','getInfoApp',['']],
    ['Cek login','meProfil',[S.token]],
    ['Beranda — buka','getDashboard',[S.token]],['Beranda — buka ulang','getDashboard',[S.token]]
  ];
  if(komite)langkah.push(['Rekap Beranda — buka','getRekapBerandaKomite',[S.token,curPeriode()]],['Rekap Beranda — buka ulang','getRekapBerandaKomite',[S.token,curPeriode()]]);
  langkah.push(['Daftar survei','getDaftarSurvei',[S.token]],['Notifikasi','getNotifikasi',[S.token]],['Pemeriksaan server menyeluruh','diagnosaSistem',[S.token]]);
  var hasil=[], el=$('#cekProses');
  function gambarProses(i){
    el.innerHTML='<div class="card card-pad mb"><h3 class="mb small">Sedang memeriksa ('+Math.min(i+1,langkah.length)+'/'+langkah.length+')</h3>'+
      langkah.map(function(l,j){var h=hasil[j];
        return '<div class="cek-baris"><span class="cek-tanda '+(h?(h.ok?'ok':'gagal'):(j===i?'jalan':''))+'"></span><span>'+esc(l[0])+'</span>'+
          '<span class="small muted">'+(h?(h.ms/1000).toFixed(1)+' dtk':(j===i?'…':''))+'</span></div>';}).join('')+'</div>';
  }
  var p=Promise.resolve();
  langkah.forEach(function(l,i){p=p.then(function(){gambarProses(i);return _ukurPanggil(l[0],l[1],l[2]).then(function(h){hasil[i]=h;});});});
  p.then(function(){
    el.innerHTML='';
    CEK={waktu:new Date(),perangkat:_infoPerangkat(),langkah:hasil,server:(hasil[hasil.length-1].ok?hasil[hasil.length-1].hasil:null),
      versiServer:(hasil[0].hasil&&hasil[0].hasil.versi)||'?'};
    tampilHasilCek();
    btn.disabled=false; btn.textContent='Jalankan ulang';
  });
}
function _median(a){a=a.slice().sort(function(x,y){return x-y;});return a.length?a[Math.floor(a.length/2)]:0;}
function _dtk(ms){return ms==null?'-':(ms/1000).toFixed(1)+' dtk';}
function analisisCek(){
  var d=CEK, sv=d.server||{}, saran=[], status={};
  var jar=d.langkah.filter(function(h){return h.fn==='getInfoApp'&&h.ok;});
  var tJar=_median(jar.map(function(h){return h.ms;}));
  var tJarMurni=_median(jar.map(function(h){return h.server!=null?h.ms-h.server:h.ms;}));
  status.jaringan={nilai:_dtk(tJar)+' per permintaan',lvl:tJar<2500?'ok':tJar<5000?'warn':'danger'};
  if(tJar>=2500)saran.push(['warn','Koneksi ke server lambat (±'+_dtk(tJar)+' per permintaan). Penyebab umum: sinyal lemah atau jaringan sibuk. Coba Wi-Fi RS atau lokasi dengan sinyal lebih baik.']);
  // versi
  status.versi={nilai:'Tampilan v'+VERSI_TAMPILAN+' · Server v'+d.versiServer,lvl:d.versiServer===VERSI_TAMPILAN?'ok':'danger'};
  if(d.versiServer!==VERSI_TAMPILAN)saran.push(['danger','Versi tampilan (index.html) dan server (Kode.gs) berbeda. Pasang kedua file terbaru, lalu Kelola deployment → pensil → Versi baru → Terapkan. Bila memakai alamat GitHub, upload juga index.html terbaru ke GitHub.']);
  // mode
  if(MODE_APPS_SCRIPT&&d.perangkat.hp)saran.push(['warn','Anda membuka SIPPI dari alamat Apps Script di HP. Alamat ini sering gagal di HP yang login akun Google. Gunakan alamat GitHub.']);
  // server functions
  var fx=(sv.fungsi||[]), maks=fx.reduce(function(m,f){return f.ms>m.ms?f:m;},{ms:0,nama:'-'});
  status.server={nilai:fx.length?'Terberat: '+_dtk(maks.ms)+' ('+maks.nama+')':'tidak terukur',lvl:!fx.length?'warn':maks.ms<4000?'ok':maks.ms<10000?'warn':'danger'};
  fx.filter(function(f){return f.ms>=4000;}).forEach(function(f){saran.push([f.ms>=10000?'danger':'warn','"'+f.nama+'" butuh '+_dtk(f.ms)+' bila dihitung tanpa cache. Data di sheet terkait mulai besar — pertimbangkan arsip tahunan.']);});
  fx.filter(function(f){return !f.ok;}).forEach(function(f){saran.push(['danger','Fungsi "'+f.nama+'" gagal: '+f.info]);});
  // cache
  var b1=d.langkah.filter(function(h){return h.fn==='getRekapBerandaKomite'||h.fn==='getDashboard';});
  status.cache={nilai:sv.cache?(sv.cache.ok?'Berfungsi':'Tidak berfungsi'):'-',lvl:sv.cache&&sv.cache.ok?'ok':'warn'};
  if(sv.cache&&!sv.cache.ok)saran.push(['warn','Cache server tidak berfungsi ('+(sv.cache.info||'')+'). Beranda & rekap akan selalu dihitung ulang sehingga lebih lambat.']);
  // data
  var sh=sv.sheet||[], besar=sh[0]||{nama:'-',baris:0}, pAlok=sv.total_sel_dialokasikan?Math.round(sv.total_sel_dialokasikan/10000)/100:0;
  status.data={nilai:'Sheet terbesar: '+besar.nama+' ('+(besar.baris||0).toLocaleString('id-ID')+' baris) · '+pAlok+' juta dari 10 juta sel',
    lvl:(besar.baris>30000||pAlok>7)?'danger':(besar.baris>15000||pAlok>4)?'warn':'ok'};
  sh.filter(function(s){return s.baris>15000;}).forEach(function(s){saran.push([s.baris>30000?'danger':'warn','Sheet "'+s.nama+'" sudah '+s.baris.toLocaleString('id-ID')+' baris. Disarankan arsip data tahun-tahun lalu agar tetap cepat.']);});
  if(pAlok>4)saran.push([pAlok>7?'danger':'warn','Spreadsheet memakai '+pAlok+' juta dari batas 10 juta sel (termasuk baris/kolom kosong).']);
  sh.filter(function(s){return s.baris_kosong>5000;}).forEach(function(s){saran.push(['info','Sheet "'+s.nama+'" punya '+s.baris_kosong.toLocaleString('id-ID')+' baris kosong di bawah data. Baris kosong ini ikut dihitung dalam batas sel dan bisa dihapus.']);});
  var ses=sh.filter(function(s){return s.nama==='Session';})[0];
  if(ses&&ses.baris>300)saran.push(['warn','Sheet Session berisi '+ses.baris+' sesi. Pembersihan otomatis berjalan saat ada yang login; bila angka ini terus naik, berarti Kode.gs terbaru belum terpasang.']);
  var aud=sh.filter(function(s){return s.nama==='AuditLog';})[0];
  if(aud&&aud.baris>20000)saran.push(['info','Audit Log sudah '+aud.baris.toLocaleString('id-ID')+' baris. Bisa diarsipkan agar spreadsheet tetap ringan.']);
  // foto
  var ft=sv.foto||{};
  status.foto={nilai:ft.error?'Izin Drive belum ada':ft.ada?(ft.jumlah+' foto · '+ft.mb+' MB'):'Belum ada folder foto',lvl:ft.error?'danger':'ok'};
  if(ft.error)saran.push(['danger','Fitur foto belum diberi izin Google Drive. Di editor Apps Script jalankan SETUP_FOTO_OBSERVASI dan setujui izinnya.']);
  if(ft.mb>10000)saran.push(['warn','Foto observasi sudah '+Math.round(ft.mb/1024)+' GB. Periksa sisa ruang Google Drive (gratis 15 GB).']);
  // alamat
  if(sv.url_exec&&/\/dev$/.test(sv.url_exec))saran.push(['warn','Server melaporkan alamat uji (/dev). Pastikan SIPPI dibuka dari alamat /exec atau GitHub.']);
  if(!MODE_APPS_SCRIPT&&sv.url_aplikasi&&sv.url_aplikasi.indexOf(API_URL)!==0&&API_URL.indexOf(sv.url_aplikasi)!==0)
    saran.push(['info','Alamat server di index.html (API_URL) berbeda dengan url_aplikasi di sheet Config. Bila deployment pernah dibuat ulang, perbarui API_URL.']);
  if(!saran.length)saran.push(['ok','Tidak ditemukan masalah. SIPPI berjalan baik di perangkat dan server ini.']);
  var urut={danger:0,warn:1,info:2,ok:3}; saran.sort(function(a,b){return urut[a[0]]-urut[b[0]];});
  return {status:status,saran:saran,tJar:tJar,tJarMurni:tJarMurni};
}

      '<td>'+(h.ok?'<span class="badge ok">OK</span>':'<span class="badge danger">Gagal</span> <span class="small">'+esc(h.info)+'</span>')+'</td></tr>';}).join('')+'</tbody></table>';
  var tblFungsi=(sv.fungsi||[]).length?'<table class="tabel-harian"><thead><tr><th>Fungsi server (dihitung penuh, tanpa cache)</th><th class="num">Lama</th><th>Status</th></tr></thead><tbody>'+
    sv.fungsi.map(function(f){return '<tr><td>'+esc(f.nama)+'</td><td class="num">'+_dtk(f.ms)+'</td><td>'+(f.ok?'<span class="badge ok">OK</span>':'<span class="badge danger">Gagal</span> <span class="small">'+esc(f.info)+'</span>')+'</td></tr>';}).join('')+'</tbody></table>':'<div class="desc">Pemeriksaan server tidak berhasil dijalankan.</div>';
  var tblSheet=(sv.sheet||[]).length?'<table class="tabel-harian"><thead><tr><th>Sheet</th><th class="num">Baris data</th><th class="num">Kolom</th><th class="num">Sel dialokasikan</th><th class="num">Baris kosong</th><th class="num">Lama baca</th></tr></thead><tbody>'+
    sv.sheet.map(function(s){return '<tr><td>'+esc(s.nama)+'</td><td class="num">'+s.baris.toLocaleString('id-ID')+'</td><td class="num">'+s.kolom+'</td><td class="num">'+s.sel_dialokasikan.toLocaleString('id-ID')+'</td><td class="num">'+s.baris_kosong.toLocaleString('id-ID')+'</td><td class="num">'+_dtk(s.ms_baca)+'</td></tr>';}).join('')+'</tbody></table>':'';
  var p=d.perangkat;
  var konf=[['Perangkat',p.os+' · '+p.browser],['Koneksi (perkiraan browser)',p.koneksi],['Cara membuka',p.mode],['Alamat',p.alamat],
    ['Alamat server (API_URL)',MODE_APPS_SCRIPT?'-':API_URL],['url_exec (dilaporkan server)',sv.url_exec||'-'],['url_aplikasi (Config)',sv.url_aplikasi||'(kosong)'],
    ['url_frontend (Config)',sv.url_frontend||'(kosong)'],['Zona waktu server',sv.zona||'-'],['Lama pemeriksaan server',_dtk(sv.total_ms)]];
  $('#cekHasil').innerHTML=
    '<div class="card card-pad mb"><div class="flex between mb" style="flex-wrap:wrap;gap:8px"><h3>Hasil pemeriksaan</h3><div class="flex" style="gap:8px">'+
      '<button class="btn ghost sm" id="cekSalin">Salin laporan</button><button class="btn ghost sm" id="cekUnduh">Unduh laporan (.txt)</button></div></div>'+
      '<div class="small muted mb">'+esc(d.waktu.toLocaleString('id-ID'))+' · '+esc(S.user.nama)+'</div>'+
      '<div class="cek-grid">'+kartu+'</div></div>'+
    '<div class="card card-pad mb"><h3 class="mb">Saran</h3>'+a.saran.map(function(s){
      return '<div class="cek-saran '+s[0]+'"><span class="badge '+(s[0]==='danger'?'danger':s[0]==='warn'?'warn':'ok')+'">'+LBL[s[0]]+'</span> '+esc(s[1])+'</div>';}).join('')+'</div>'+
    '<div class="card card-pad mb"><h3 class="mb">Waktu tiap langkah (dari perangkat ini)</h3><div class="desc mb">"Di server" = lama proses di Google; "Jaringan" = sisanya (perjalanan data lewat internet). '+
      'Kolom server hanya terisi bila dibuka dari alamat GitHub.</div><div class="table-scroll">'+tblLangkah+'</div></div>'+
    '<div class="card card-pad mb"><h3 class="mb">Beban server</h3><div class="table-scroll">'+tblFungsi+'</div></div>'+
    '<div class="card card-pad mb"><h3 class="mb">Ukuran data per sheet</h3><div class="desc mb">Total sel dialokasikan: '+
      (sv.total_sel_dialokasikan||0).toLocaleString('id-ID')+' dari batas 10.000.000.</div><div class="table-scroll">'+tblSheet+'</div></div>'+
    '<div class="card card-pad mb"><h3 class="mb">Konfigurasi</h3><table class="tabel-harian"><tbody>'+
      konf.map(function(k){return '<tr><td style="width:38%"><b>'+esc(k[0])+'</b></td><td style="word-break:break-all">'+esc(k[1])+'</td></tr>';}).join('')+'</tbody></table></div>';
  $('#cekSalin').onclick=function(){
    var t=teksLaporanCek(a);
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Laporan disalin ✓ — tempel di WhatsApp/chat','ok');},
      function(){modalWide('Salin laporan','<textarea style="width:100%;height:320px" readonly>'+esc(t)+'</textarea>');});
  };
  $('#cekUnduh').onclick=function(){
    var url=URL.createObjectURL(new Blob([teksLaporanCek(a)],{type:'text/plain'}));
    var x=document.createElement('a'); x.href=url; x.download='Cek Sistem SIPPI '+todayISO()+'.txt'; document.body.appendChild(x); x.click(); x.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},30000);
  };
}
function teksLaporanCek(a){
  var d=CEK, sv=d.server||{}, p=d.perangkat, L=[];
  L.push('LAPORAN CEK SISTEM SIPPI AMI','Waktu: '+d.waktu.toLocaleString('id-ID')+' · Oleh: '+S.user.nama+' ('+S.user.role+')',
    'Versi: tampilan '+VERSI_TAMPILAN+' / server '+d.versiServer,'Perangkat: '+p.os+' · '+p.browser+' · koneksi '+p.koneksi,'Cara membuka: '+p.mode+' · '+p.alamat,'');
  L.push('RINGKASAN');
  Object.keys(a.status).forEach(function(k){L.push('- '+k+': '+a.status[k].lvl.toUpperCase()+' — '+a.status[k].nilai);});
  L.push('','SARAN'); a.saran.forEach(function(s){L.push('- ['+s[0].toUpperCase()+'] '+s[1]);});
  L.push('','WAKTU TIAP LANGKAH (total / server / jaringan)');
  d.langkah.forEach(function(h){L.push('- '+h.label+': '+_dtk(h.ms)+' / '+_dtk(h.server)+' / '+(h.server!=null?_dtk(h.ms-h.server):'-')+(h.ok?'':' GAGAL: '+h.info));});
  L.push('','BEBAN SERVER (tanpa cache)'); (sv.fungsi||[]).forEach(function(f){L.push('- '+f.nama+': '+_dtk(f.ms)+(f.ok?'':' GAGAL: '+f.info));});
  L.push('','SHEET (baris / kolom / sel dialokasikan / baris kosong / lama baca)');
  (sv.sheet||[]).forEach(function(s){L.push('- '+s.nama+': '+s.baris+' / '+s.kolom+' / '+s.sel_dialokasikan+' / '+s.baris_kosong+' / '+_dtk(s.ms_baca));});
  L.push('Total sel dialokasikan: '+(sv.total_sel_dialokasikan||0),'');
  L.push('CACHE: '+(sv.cache?(sv.cache.ok?'berfungsi':'TIDAK berfungsi '+(sv.cache.info||'')):'-'));
  var ft=sv.foto||{}; L.push('FOTO: '+(ft.error?ft.error:ft.ada?ft.jumlah+' foto, '+ft.mb+' MB, '+ft.folder_bulan+' folder bulan':'belum ada folder'));
  L.push('ALAMAT: API_URL='+(MODE_APPS_SCRIPT?'-':API_URL)+' | url_exec='+(sv.url_exec||'-')+' | url_aplikasi='+(sv.url_aplikasi||'-')+' | url_frontend='+(sv.url_frontend||'-'));
  return L.join('\n');
}

/* Fungsi utama. opts: {judul, sub, elemen | konten, orientasi, namaFile} */
function ppiPDF(opts){
  return dialogTtd().then(function(ttd){
    toast('Menyiapkan PDF…','ok');
    var aktif=ttd.p.slice(0,ttd.jumlah), qr=aktif.map(function(p,i){return p.jenis==='qr'?{urut:i+1,nama:p.nama,jabatan:p.jabatan,nip:p.nip}:null;}).filter(Boolean);
    var namaDok=(opts.namaFile||opts.judul||'Laporan SIPPI AMI');
    var daftar=qr.length?call('daftarVerifikasiTTD',S.token,{judul:opts.judul||namaDok,sub:opts.sub||'',nama_file:namaDok,tanggal:todayISO(),penanda:qr,asal:document.referrer||'',basis:MODE_APPS_SCRIPT?'':(location.origin+location.pathname)})
      .then(function(v){if(!v||!v.ok)throw new Error((v&&v.pesan)||'Gagal mendaftarkan tanda tangan QR.');
        if(v.peringatan)setTimeout(function(){modal('Perhatian: QR tanda tangan','<p class="small">'+esc(v.peringatan)+'</p>');},1500);
        return v;}):Promise.resolve(null);
    var verif=null;
    return daftar.then(function(v){verif=v;return muatPdfLib();}).then(function(){
      var orient=opts.orientasi||'landscape', lebar=orient==='landscape'?842-72:595-72;
      var isi=[].concat(kopPdf(lebar));
      if(opts.judul)isi.push({text:String(opts.judul).toUpperCase(),bold:true,fontSize:12.5,alignment:'center',margin:[0,4,0,2]});
      if(opts.sub)isi.push({text:opts.sub,fontSize:9.5,alignment:'center',margin:[0,0,0,10]});
      isi=isi.concat(opts.konten||domKePdf(opts.elemen,lebar));
      for(var i=isi.length-2;i>=0;i--){   // judul bagian selalu menempel pada gambar/tabel pendek di bawahnya
        var j=isi[i], nx=isi[i+1];
        if(j&&j.headlineLevel===1&&nx&&nx.unbreakable){
          var pb=j.pageBreak, po=j.pageOrientation; delete j.pageBreak; delete j.pageOrientation; delete j.headlineLevel;
          var gab={unbreakable:true,stack:[j,nx.stack?{stack:nx.stack}:Object.assign({},nx,{unbreakable:undefined})]};
          if(pb){gab.pageBreak=pb;gab.pageOrientation=po;}
          isi.splice(i,2,gab);
        }
      }
      var akhir=isi[isi.length-1];
      if(opts.konten&&akhir&&akhir.text!==undefined&&!akhir.table&&isi.length>2){   // paragraf terakhir + judulnya ikut bersama tanda tangan
        var ekor=[isi.pop()]; if(isi[isi.length-1]&&isi[isi.length-1].headlineLevel===1)ekor.unshift(isi.pop());
        ekor.forEach(function(x){delete x.headlineLevel;});
        isi.push({unbreakable:true,stack:ekor.concat([ttdPdf(ttd,lebar,verif)])});
      } else isi.push(ttdPdf(ttd,lebar,verif));
      var dicetak='Dicetak dari SIPPI AMI · '+tglPanjangID(todayISO())+' '+new Date().toTimeString().slice(0,5)+' · '+S.user.nama+
        (verif?' · Kode verifikasi tanda tangan: '+verif.kode:'');
      var dd={pageSize:'A4',pageOrientation:orient,pageMargins:[36,30,36,36],content:isi,
        pageBreakBefore:function(node,berikut){return node.headlineLevel===1&&berikut.length===0;},
        defaultStyle:{fontSize:9,lineHeight:1.15},
        footer:function(cur,total){return {columns:[{text:dicetak,fontSize:7,color:'#666'},{text:'Halaman '+cur+' dari '+total,fontSize:7,color:'#666',alignment:'right'}],margin:[36,10,36,0]};},
        info:{title:opts.judul||'Laporan SIPPI AMI',author:'SIPPI AMI — RSUD Aji Muhammad Idris'}};
      var nama=(opts.namaFile||opts.judul||'Laporan SIPPI AMI').replace(/[\\\/:*?"<>|]+/g,'-')+'.pdf';
      return new Promise(function(ok){pdfMake.createPdf(dd).getBase64(function(b64){ok({b64:b64,nama:nama});});});
    }).then(function(h){
      unduhBase64(h.b64,h.nama);
      toast('PDF diunduh ✓','ok');
      return h;
    });
  }).catch(function(e){toast('Gagal membuat PDF: '+((e&&e.message)||e),'err');});
}
/* Dipanggil halaman tambahan (Rekap Data Pasien, Bundle): data tabel dari server -> PDF. */
function ppiPDFData(r){
  var konten=[];
  (r.tabel||[]).forEach(function(t){
    if(t.judul)konten.push({text:t.judul,bold:true,fontSize:10.5,margin:[0,6,0,4]});
    var n=t.head.length;
    var body=[t.head.map(function(h){return {text:h,bold:true,fillColor:'#E2EFDA',alignment:'center'};})].concat(
      t.rows.map(function(row){return row.map(function(v,i){var s=String(v==null?'':v);return {text:s,alignment:(t.kiri||[]).indexOf(i)>=0?'left':'center',bold:row.indexOf('TOTAL')>=0};});}));
    if(!t.rows.length)body.push([{text:t.kosong||'Tidak ada data.',colSpan:n,alignment:'center',italics:true}].concat(Array(n-1).fill({})));
    konten.push({table:{headerRows:1,widths:t.widths||Array(n).fill('*'),body:body},
      layout:{hLineWidth:function(){return .5;},vLineWidth:function(){return .5;},paddingLeft:function(){return 3;},paddingRight:function(){return 3;}},
      fontSize:n>10?7.5:8.5,margin:[0,0,0,10]});
  });
  if(r.catatan)konten.push({text:r.catatan,fontSize:8.5,italics:true});
  return ppiPDF({judul:r.judul,sub:r.sub,konten:konten,orientasi:r.orientasi||'landscape',namaFile:r.nama_file});
}
